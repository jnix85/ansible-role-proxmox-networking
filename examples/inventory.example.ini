; Copy this to inventory.ini (or your own path) and fill in real hostnames/IPs.
; Both example nodes are in the same "proxmox" group used by the SDN role's
; proxmox_sdn_cluster_group default — keep that name in sync if you rename it.

[proxmox]
pve-bonded-example  ansible_host=192.0.2.11
pve-singlenic-example ansible_host=192.0.2.12

[proxmox:vars]
ansible_user=root
